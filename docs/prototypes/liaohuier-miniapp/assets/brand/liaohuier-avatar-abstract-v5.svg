    <path d="M512 221C530 247 529 269 512 286C495 269 494 247 512 221Z" fill="#f7f0e5" opacity=".78"/>
    <path d="M575 263C600 218 654 220 694 257C688 303 637 310 601 288C621 282 632 265 629 247C613 273 594 276 575 263Z" fill="#c95032"/>
    <path d="M769 381C795 348 842 354 873 385C845 418 800 416 769 381Z" fill="#8b623f"/>
    <path d="M790 383C808 366 834 366 851 384C831 400 809 399 790 383Z" fill="#f7f0e5" opacity=".72"/>
