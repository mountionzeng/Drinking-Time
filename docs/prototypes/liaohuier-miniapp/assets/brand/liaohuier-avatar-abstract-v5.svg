  <!-- The shared conversation becomes a five-colour tea ripple. -->
  <g fill="none" stroke-linecap="round">
    <path d="M512 574C559 574 584 590 584 610C584 633 551 647 512 647C473 647 440 633 440 610C440 590 465 574 512 574" stroke="#d69a27" stroke-width="15"/>
